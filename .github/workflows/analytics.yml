name: Build Analytics Hub

permissions:
  contents: write

on:
  schedule:
    - cron: "20 15 * * *"   # 20 minutes after daily post (7:20 AM PST)
  workflow_dispatch:

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Mark repo safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build analytics
        run: python scripts/build_analytics.py

      - name: Commit & push analytics artifacts
        run: |
          git config user.name "scalepilot-bot"
          git config user.email "scalepilot-bot@users.noreply.github.com"
          git add analytics/posts_features.csv analytics/feature_summary.csv analytics/latest_report.md analytics/for_chatgpt.md || true
          git commit -m "analytics: update reports [skip ci]" || echo "No changes"
          git push
